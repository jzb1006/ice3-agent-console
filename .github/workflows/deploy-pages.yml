name: Deploy demo to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Agent Console
        uses: actions/checkout@v7
        with:
          path: ice3-agent-console

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ice3-agent-console/.nvmrc
          cache: npm
          cache-dependency-path: ice3-agent-console/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install Agent Console dependencies
        working-directory: ice3-agent-console
        run: npm ci

      - name: Validate documentation
        working-directory: ice3-agent-console
        run: npm run docs:check

      - name: Typecheck
        working-directory: ice3-agent-console
        run: npm run typecheck

      - name: Run unit tests
        working-directory: ice3-agent-console
        run: npm test

      - name: Build static demo
        working-directory: ice3-agent-console
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ice3-agent-console/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
